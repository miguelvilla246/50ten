name: Apply 50Ten brand palette

on:
  push:
    paths:
      - '.github/workflows/apply-brand-palette.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace legacy colors with approved variables
        shell: python
        run: |
          from pathlib import Path
          import re

          palette = ':root{--brand-navy:#0A1D37;--brand-silver:#C7C9CD;--brand-charcoal:#1A1A1A;--brand-white:#FFFFFF;--neutral-050:#F8F8F7;--neutral-100:#F2F2F0;--neutral-200:#E5E5E2;--neutral-400:#A3A3A0;--neutral-600:#60605D;--navy:var(--brand-navy);--navy2:var(--brand-navy);--ivory:var(--neutral-100);--paper:var(--neutral-050);--ink:var(--brand-charcoal);--muted:var(--neutral-600);--sage:var(--neutral-400);--line:var(--neutral-200)}'

          replacements = {
            '#0b203b':'var(--brand-navy)', '#102a49':'var(--brand-navy)', '#07172b':'var(--brand-navy)', '#17385e':'var(--brand-navy)',
            '#132033':'var(--brand-charcoal)', '#0f1f33':'var(--brand-charcoal)',
            '#ffffff':'var(--brand-white)', '#fbfaf6':'var(--neutral-050)', '#f6f5f0':'var(--neutral-050)',
            '#f5f3ec':'var(--neutral-100)', '#f1f0ea':'var(--neutral-100)',
            '#ebece6':'var(--neutral-200)', '#eceee9':'var(--neutral-200)', '#dfe2dc':'var(--neutral-200)', '#d8dcd5':'var(--neutral-200)', '#e8eee2':'var(--neutral-200)',
            '#66717b':'var(--neutral-600)', '#708061':'var(--neutral-600)', '#7d8e6e':'var(--neutral-600)', '#78886c':'var(--neutral-600)', '#526744':'var(--neutral-600)',
            '#8ea27a':'var(--neutral-400)', '#9caf89':'var(--neutral-400)', '#8f9baa':'var(--neutral-400)',
            '#c7d0d9':'var(--brand-silver)', '#d6dce3':'var(--brand-silver)', '#d0d8e0':'var(--brand-silver)', '#cfd4cf':'var(--brand-silver)', '#cbd4dc':'var(--brand-silver)', '#bfc9d3':'var(--brand-silver)', '#bfc8b7':'var(--brand-silver)', '#bdc8d4':'var(--brand-silver)', '#b9c2cc':'var(--brand-silver)', '#d9e6cf':'var(--brand-silver)', '#d7e0e8':'var(--brand-silver)',
            '#ffffff24':'color-mix(in srgb,var(--brand-white) 14%,transparent)', '#ffffff1d':'color-mix(in srgb,var(--brand-white) 11%,transparent)', '#ffffff55':'color-mix(in srgb,var(--brand-white) 33%,transparent)', '#ffffff33':'color-mix(in srgb,var(--brand-white) 20%,transparent)', '#ffffff22':'color-mix(in srgb,var(--brand-white) 13%,transparent)', '#ffffff26':'color-mix(in srgb,var(--brand-white) 15%,transparent)', '#ffffff1c':'color-mix(in srgb,var(--brand-white) 11%,transparent)', '#ffffff1f':'color-mix(in srgb,var(--brand-white) 12%,transparent)', '#ffffff3b':'color-mix(in srgb,var(--brand-white) 23%,transparent)', '#8ea27a55':'color-mix(in srgb,var(--neutral-400) 33%,transparent)', '#8ea27a80':'color-mix(in srgb,var(--neutral-400) 50%,transparent)'
          }

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new).replace(old.upper(), new)
              text = re.sub(r':root\\{[^}]*\\}', palette, text, count=1)
              path.write_text(text, encoding='utf-8')

      - name: Commit palette update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No palette changes needed.'
          else
            git commit -m 'Update website to approved 50Ten color palette'
            git push
          fi
