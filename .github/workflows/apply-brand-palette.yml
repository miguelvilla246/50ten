name: Apply 50Ten brand palette

on:
  push:
    paths:
      - '.github/workflows/apply-brand-palette.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize approved 50Ten color variables
        shell: python
        run: |
          from pathlib import Path
          import re

          palette = ':root{--brand-navy:#0A1D37;--brand-silver:#C7C9CD;--brand-charcoal:#1A1A1A;--brand-white:#FFFFFF;--neutral-050:#F8F8F7;--neutral-100:#F2F2F0;--neutral-200:#E5E5E2;--neutral-400:#A3A3A0;--neutral-600:#60605D;--navy:var(--brand-navy);--navy2:var(--brand-navy);--ivory:var(--neutral-100);--paper:var(--neutral-050);--ink:var(--brand-charcoal);--muted:var(--neutral-600);--sage:var(--brand-silver);--line:var(--neutral-200)}'

          alpha = {
            'var(--brand-white)24':'color-mix(in srgb,var(--brand-white) 14%,transparent)',
            'var(--brand-white)1d':'color-mix(in srgb,var(--brand-white) 11%,transparent)',
            'var(--brand-white)55':'color-mix(in srgb,var(--brand-white) 33%,transparent)',
            'var(--brand-white)33':'color-mix(in srgb,var(--brand-white) 20%,transparent)',
            'var(--brand-white)22':'color-mix(in srgb,var(--brand-white) 13%,transparent)',
            'var(--brand-white)26':'color-mix(in srgb,var(--brand-white) 15%,transparent)',
            'var(--brand-white)1c':'color-mix(in srgb,var(--brand-white) 11%,transparent)',
            'var(--brand-white)1f':'color-mix(in srgb,var(--brand-white) 12%,transparent)',
            'var(--brand-white)3b':'color-mix(in srgb,var(--brand-white) 23%,transparent)',
            'var(--neutral-400)55':'color-mix(in srgb,var(--neutral-400) 33%,transparent)',
            'var(--neutral-400)80':'color-mix(in srgb,var(--neutral-400) 50%,transparent)'
          }
          literal = {
            'color:white':'color:var(--brand-white)', 'color:#fff':'color:var(--brand-white)',
            'background:white':'background:var(--brand-white)', 'background:#fff':'background:var(--brand-white)',
            'background:#fff;':'background:var(--brand-white);',
            '#0b203b':'var(--brand-navy)', '#102a49':'var(--brand-navy)', '#07172b':'var(--brand-navy)', '#17385e':'var(--brand-navy)',
            '#132033':'var(--brand-charcoal)', '#0f1f33':'var(--brand-charcoal)',
            '#fbfaf6':'var(--neutral-050)', '#f6f5f0':'var(--neutral-050)', '#f5f3ec':'var(--neutral-100)', '#f1f0ea':'var(--neutral-100)',
            '#ebece6':'var(--neutral-200)', '#eceee9':'var(--neutral-200)', '#dfe2dc':'var(--neutral-200)', '#d8dcd5':'var(--neutral-200)', '#e8eee2':'var(--neutral-200)',
            '#66717b':'var(--neutral-600)', '#708061':'var(--neutral-600)', '#7d8e6e':'var(--neutral-600)', '#78886c':'var(--neutral-600)', '#526744':'var(--neutral-600)',
            '#8ea27a':'var(--brand-silver)', '#9caf89':'var(--brand-silver)', '#8f9baa':'var(--brand-silver)',
            '#c7d0d9':'var(--brand-silver)', '#d6dce3':'var(--brand-silver)', '#d0d8e0':'var(--brand-silver)', '#cfd4cf':'var(--brand-silver)', '#cbd4dc':'var(--brand-silver)', '#bfc9d3':'var(--brand-silver)', '#bfc8b7':'var(--brand-silver)', '#bdc8d4':'var(--brand-silver)', '#b9c2cc':'var(--brand-silver)', '#d9e6cf':'var(--brand-silver)', '#d7e0e8':'var(--brand-silver)'
          }

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              text = re.sub(r':root\\{[^}]*\\}', palette, text, count=1)
              for old,new in alpha.items(): text = text.replace(old,new)
              for old,new in literal.items(): text = text.replace(old,new).replace(old.upper(),new)
              # Update remaining old rgba navy overlays to approved navy RGB.
              text = text.replace('rgba(11,32,59,', 'rgba(10,29,55,').replace('rgba(10,28,51,','rgba(10,29,55,')
              path.write_text(text,encoding='utf-8')

      - name: Commit palette update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No palette changes needed.'
          else
            git commit -m 'Finalize approved 50Ten website palette'
            git push
          fi
