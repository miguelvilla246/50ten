name: Apply 50Ten mobile refinements

on:
  push:
    paths:
      - '.github/workflows/apply-brand-palette.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile section and navigation refinements
        shell: python
        run: |
          from pathlib import Path

          css = """
/* 50Ten mobile visual refinement */
@media(max-width:800px){
  .nav,.nav.inner{background:var(--brand-white)!important;color:var(--brand-navy)!important;border-bottom:1px solid var(--neutral-200)!important}
  .nav .wrap{height:96px!important}
  .brand img{width:138px!important;height:64px!important;filter:none!important}
  .mobile-menu-btn{background:var(--brand-navy)!important;border:1px solid var(--brand-navy)!important;color:var(--brand-white)!important;box-shadow:0 5px 16px rgba(10,29,55,.16)!important}
  .mobile-menu-btn span{background:var(--brand-white)!important}
  .mobile-menu-btn[aria-expanded='true']{background:var(--brand-silver)!important;border-color:var(--brand-silver)!important}
  .mobile-menu-btn[aria-expanded='true'] span{background:var(--brand-navy)!important}
  .mobile-menu{background:var(--brand-navy)!important;color:var(--brand-white)!important;opacity:1!important;box-shadow:0 18px 38px rgba(10,29,55,.2)!important}
  .mobile-menu a{color:var(--brand-white)!important;border-color:color-mix(in srgb,var(--brand-white) 22%,transparent)!important}
  .mobile-menu a:after{color:var(--brand-silver)!important}
  .mobile-menu .mobile-cta,.mobile-menu a:last-child{color:var(--brand-navy)!important;background:var(--brand-silver)!important;border-color:var(--brand-silver)!important}
  main>section:not(.hero):not(.page-hero):not(.dark):not(.cta):nth-of-type(even){background:var(--neutral-050)}
  main>section:not(.hero):not(.page-hero):not(.dark):not(.cta):nth-of-type(odd){background:var(--brand-white)}
  main>section:not(.hero):not(.page-hero):not(.dark):not(.cta){border-top:1px solid var(--neutral-200)}
  main>section+section{margin-top:0}
  .service-row{padding-top:72px!important;padding-bottom:72px!important;border-top:1px solid var(--neutral-200)!important}
  .service-row:nth-child(even){background:var(--neutral-050)!important}
  .service-row:nth-child(odd){background:var(--brand-white)!important}
  .service-row:first-child{border-top:0!important}
}
"""

          marker = '/* 50Ten mobile visual refinement */'
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  start = text.index(marker)
                  end = text.find('</style>', start)
                  if end != -1:
                      text = text[:start] + css + text[end:]
              else:
                  text = text.replace('</style>', css + '\n</style>', 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit mobile refinements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No mobile refinements needed.'
          else
            git commit -m 'Apply mobile section separation and navigation contrast'
            git push
          fi
